# Server Configuration
server.port=8080

# Spring Cloud Gateway Configuration
spring.cloud.gateway.routes[0].id=pedidos-service
spring.cloud.gateway.routes[0].uri=${PEDIDOS_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/pedidos/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=CircuitBreaker=name=pedidosCB,fallbackUri=forward:/fallback/pedidos

spring.cloud.gateway.routes[1].id=inventario-service
spring.cloud.gateway.routes[1].uri=${INVENTARIO_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventario/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=CircuitBreaker=name=inventarioCB,fallbackUri=forward:/fallback/inventario

spring.cloud.gateway.routes[2].id=envios-service
spring.cloud.gateway.routes[2].uri=${ENVIOS_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/envios/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1]=CircuitBreaker=name=enviosCB,fallbackUri=forward:/fallback/envios

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=gateway-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.pedidosCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pedidosCB.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.pedidosCB.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.inventarioCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventarioCB.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.inventarioCB.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.enviosCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.enviosCB.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.enviosCB.permitted-number-of-calls-in-half-open-state=3