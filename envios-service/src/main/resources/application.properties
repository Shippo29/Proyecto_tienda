spring.application.name=envios-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/db_envios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=envios-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.*

resilience4j.circuitbreaker.instances.kafka-envios.sliding-window-size=5
resilience4j.circuitbreaker.instances.kafka-envios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafka-envios.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.kafka-envios.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafka-envios.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.kafka-envios.register-health-indicator=true

resilience4j.retry.instances.kafka-envios.max-attempts=3
resilience4j.retry.instances.kafka-envios.wait-duration=1s

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always